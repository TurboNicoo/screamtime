# Elke push naar main: eerst alles controleren, pas daarna publiceren op GitHub Pages.
# Faalt een controle, dan blijft de vorige (werkende) versie online.
name: Test en publiceer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax van alle scripts
        run: for f in app.js engine.js sources.js sw.js online.js config.js; do node --check "$f"; done
      - name: Release-controles (versies, geheimen)
        run: node tests/release.check.js
      - name: Meetkern-tests
        run: node tests/engine.test.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
