<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#07040d}
.bg{position:absolute;inset:0;background:url(../img/car-hood-purple.jpg) 50% 58%/cover;filter:saturate(1.2) brightness(.62)}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,4,13,.05) 0%,rgba(7,4,13,.55) 42%,#07040d 68%),radial-gradient(60% 80% at 80% 50%,rgba(255,47,120,.25),transparent 70%)}
.txt{position:absolute;right:56px;top:50%;transform:translateY(-50%);text-align:center;width:430px}
svg{width:120px;height:120px;filter:drop-shadow(0 0 22px rgba(255,47,120,.8))}
small{display:block;font:800 13px Inter;letter-spacing:.5em;color:#cdbfe3;margin-top:10px}
.n{font:400 82px/1 Anton;color:#fff;letter-spacing:.03em;text-shadow:0 1px 0 #d9c9ef,0 2px 0 #b9a3d8,0 3px 0 #9a7fc2,0 4px 0 #7b5aa9,0 5px 0 #5c3b8c,0 12px 22px rgba(0,0,0,.6)}
.n b{font-weight:400;background:linear-gradient(180deg,#ffd6b8,#ff7a3d 45%,#ff2f78 75%,#a238ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
p{font:700 19px Inter;color:#f4eefb;margin:14px 0 0;letter-spacing:.02em}
p span{color:#ff9a6b}
</style></head><body>
<div class="bg"></div><div class="fade"></div>
<div class="txt">
<svg viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a3d"/><stop offset=".55" stop-color="#ff2f78"/><stop offset="1" stop-color="#a238ff"/></linearGradient></defs>
<path d="M14.7 49.3A24 24 0 1 1 49.3 49.3" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/><path d="M22 44 L44 20" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="32" r="5.5" fill="#fff"/><circle cx="32" cy="32" r="2.4" fill="#ff2f78"/></svg>
<small>STREET SCREAMER</small>
<div class="n">SCREAM<b>TIME</b></div>
<p>0–500 km/u · ¼ mijl · remtest<br><span>GPS + sensor · camera-overlay · ranglijst</span></p>
</div></body></html>
